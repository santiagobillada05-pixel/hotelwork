services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hotelwork_backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=HotelWork
      - DEBUG=False
      - DATABASE_URL=sqlite:///./hotelwork.db
      - SECRET_KEY=hotelwork-super-secret-jwt-key-change-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - TAX_RATE=0.19
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
    volumes:
      - backend_data:/app/backups
      - backend_db:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hotelwork_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
  backend_db:
